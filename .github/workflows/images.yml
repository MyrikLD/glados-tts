name: Images

on:
  push:
    branches: [main]
    paths: &paths
      - "train/**"
      - "server/**"
      - "server-gguf/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: |
          uvx ruff check .
          uvx ruff format --check .

  images:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The ROCm torch layer alone is about 15 GB; the stock runner has too little free disk for it.
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
          swap-storage: true
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One job builds the images in turn, so server reuses the torch layer of train.
      - name: Build
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          for name in train server server-gguf; do
            image=ghcr.io/$OWNER/glados-tts-$name
            docker build -t "$image:latest" -t "$image:sha-${GITHUB_SHA::7}" "$name"
          done
          docker image ls
          df -h /
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          for name in train server server-gguf; do
            docker push --all-tags "ghcr.io/$OWNER/glados-tts-$name"
          done
