# Wyoming TTS service for Home Assistant (add as a Wyoming integration on port 10200).
#
# Env:
#   DATA_DIR    same folder as for training; the checkpoint is read from it
#   CKPT        checkpoint path inside the container
#   VOICE_LANG  language code the checkpoint was trained on, e.g. ru
#   RENDER_GID  GID of the host's render group: getent group render | cut -d: -f3

services:
  glados:
    image: ${IMAGE:-ghcr.io/myrikld/glados-tts-server:latest}
    restart: unless-stopped
    ports:
      - "10200:10200"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID}
    shm_size: 2g
    environment:
      - CKPT=${CKPT}
      - VOICE_LANG=${VOICE_LANG}
      - CHUNK_SIZE=8
    volumes:
      - ${DATA_DIR}:/data:ro
